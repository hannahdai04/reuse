experiment_name: strategyqa_real5_autogen_openai
dataset:
  builder: strategyqa
  data_path: data/real_samples/strategyqa_dev_real_5.json
  split: dev
  limit: 5
task:
  type: qa
mas:
  type: autogen
llm:
  provider: openai-compatible
  model: ${OPENAI_MODEL}
  timeout: 90
  retries: 2
  temperature: 0
  max_tokens: 32
  extra_body:
    enable_thinking: false
memory:
  provider: null
output:
  dir: runs
