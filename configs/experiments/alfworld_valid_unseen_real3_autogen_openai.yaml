experiment_name: alfworld_valid_unseen_real3_autogen_openai

dataset:
  builder: alfworld
  data_path: ${ALFWORLD_DATA}
  split: valid_unseen
  limit: 3

task:
  type: interactive
  max_steps: 30

mas:
  type: autogen

llm:
  provider: openai-compatible
  model: ${OPENAI_MODEL}
  timeout: 45
  retries: 0
  temperature: 0
  max_tokens: 64
  extra_body:
    enable_thinking: false

memory:
  provider: null

environment:
  provider: alfworld
  config:
    config_path: configs/environments/alfworld_textworld_base.yaml
    env_type: AlfredTWEnv
    batch_size: 1

output:
  dir: runs
