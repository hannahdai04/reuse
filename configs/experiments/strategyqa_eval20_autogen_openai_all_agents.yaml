experiment_name: strategyqa_eval20_autogen_openai_all_agents
dataset:
  builder: strategyqa
  data_path: data/real_samples/strategyqa_dev_full.json
  split: dev
  limit: 20
  offset: 50
task:
  type: qa
mas:
  type: autogen
llm:
  provider: openai-compatible
  model: ${OPENAI_MODEL}
  timeout: 90
  retries: 2
  temperature: 0
  max_tokens: 32
  extra_body:
    enable_thinking: false
memory:
  provider: llm-scope
  config:
    bank_path: runs/memory_banks/seed.jsonl
    policy_mode: all-agents
    candidate_top_k: 20
    selected_top_k: 3
    score_threshold: 0.6
output:
  dir: runs
